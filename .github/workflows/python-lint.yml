name: Python Lint

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]
    paths:
      - 'pipelines/**'
      - 'src/**'
      - 'tests/**'
      - 'inference/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: python-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff==0.15.12

      - name: Lint Python
        run: ruff check pipelines src tests inference
