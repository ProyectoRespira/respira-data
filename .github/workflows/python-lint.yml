name: Python Lint

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]
    paths:
      - 'pipelines/**'
      - 'src/**'
      - 'tests/**'
      - 'inference/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: python-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff==0.15.12

      - name: Lint Python
        run: ruff check pipelines src tests inference
