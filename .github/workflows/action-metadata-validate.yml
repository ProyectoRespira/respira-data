name: Action Metadata Validate

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/actions/**/action.yml'
      - '.github/actions/**/action.yaml'
      - '.github/workflows/action-metadata-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-metadata-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-action-metadata:
    name: Validate Action Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml==6.0.3

      - name: Validate action metadata files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          files = sorted(Path('.github/actions').glob('**/action.y*ml'))
          if not files:
              print('No local action metadata files found under .github/actions')
              sys.exit(0)

          allowed_using = {'composite', 'docker', 'node20', 'node24'}
          required_top = {'name', 'description', 'runs'}
          errors = []

          for file_path in files:
              try:
                  with file_path.open('r', encoding='utf-8') as f:
                      data = yaml.safe_load(f)
              except Exception as exc:
                  errors.append(f'{file_path}: invalid YAML: {exc}')
                  continue

              if not isinstance(data, dict):
                  errors.append(f'{file_path}: top-level document must be a mapping')
                  continue

              missing = sorted(required_top - set(data.keys()))
              if missing:
                  errors.append(f"{file_path}: missing required top-level keys: {', '.join(missing)}")

              runs = data.get('runs')
              if not isinstance(runs, dict):
                  errors.append(f'{file_path}: runs must be a mapping')
                  continue

              using = runs.get('using')
              if using not in allowed_using:
                  errors.append(
                      f"{file_path}: runs.using must be one of {sorted(allowed_using)}, got: {using!r}"
                  )
                  continue

              if using == 'composite':
                  steps = runs.get('steps')
                  if not isinstance(steps, list) or len(steps) == 0:
                      errors.append(f'{file_path}: composite actions must define a non-empty runs.steps list')

              outputs = data.get('outputs')
              if outputs is not None:
                  if not isinstance(outputs, dict):
                      errors.append(f'{file_path}: outputs must be a mapping when present')
                  else:
                      for output_name, output_data in outputs.items():
                          if not isinstance(output_data, dict):
                              errors.append(
                                  f'{file_path}: outputs.{output_name} must be a mapping'
                              )
                              continue
                          if 'description' not in output_data:
                              errors.append(
                                  f'{file_path}: outputs.{output_name}.description is required'
                              )
                          if using == 'composite' and 'value' not in output_data:
                              errors.append(
                                  f'{file_path}: outputs.{output_name}.value is required for composite actions'
                              )

          if errors:
              print('Action metadata validation failed:')
              for err in errors:
                  print(f' - {err}')
              sys.exit(1)

          print(f'Validated {len(files)} action metadata file(s) successfully.')
          PY
