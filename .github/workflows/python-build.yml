name: Python Build

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]
    paths:
      - 'pipelines/**'
      - 'src/**'
      - 'tests/**'
      - 'inference/**'
      - 'pyproject.toml'
      - '.github/workflows/python-build.yml'

permissions:
  contents: read

concurrency:
  group: python-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Python Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Build Python bytecode
        run: python -m compileall -q pipelines src tests inference
