name: Python Build

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]
    paths:
      - 'pipelines/**'
      - 'src/**'
      - 'tests/**'
      - 'inference/**'
      - 'pyproject.toml'
      - '.github/workflows/python-build.yml'

permissions:
  contents: read

concurrency:
  group: python-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Python Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Build Python bytecode
        run: python -m compileall -q pipelines src tests inference
