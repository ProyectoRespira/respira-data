name: Deploy Image Validation

run-name: Validate deployment image failure handling

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  missing-image-pull-fails:
    name: Missing image pull fails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attempt to pull a non-existent deployment image
        id: pull_missing_image
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          temp_env_file="$RUNNER_TEMP/deploy-image-validation.env"

          {
            printf 'APP_IMAGE_TAG=%s\n' '__definitely_missing__'
            printf 'WORKER_IMAGE_TAG=%s\n' 'dev-latest'
          } > "$temp_env_file"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.remote.yml \
            --env-file "$temp_env_file" \
            pull app

      - name: Assert the missing image pull failed
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "${{ steps.pull_missing_image.outcome }}" = "success" ]; then
            echo "::error title=Validation failed::Expected docker compose pull to fail for the missing app image tag."
            echo "Expected docker compose pull to fail for a non-existent image tag."
            exit 1
          fi

          echo "Expected failure observed for a missing deployment image tag."
