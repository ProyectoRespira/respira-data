name: Deploy Image Validation

run-name: Validate deployment image failure handling

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  missing-image-pull-fails:
    name: Missing image pull fails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify a known deployment image can be pulled
        shell: bash
        run: |
          set -Eeuo pipefail

          temp_env_file="$RUNNER_TEMP/deploy-image-validation.env"

          {
            printf 'APP_IMAGE_TAG=%s\n' 'dev-latest'
            printf 'WORKER_IMAGE_TAG=%s\n' 'dev-latest'
          } > "$temp_env_file"

          ENV_FILE="$temp_env_file" docker compose \
            -f docker-compose.yml \
            -f docker-compose.remote.yml \
            --env-file "$temp_env_file" \
            pull app

      - name: Verify a missing image fails for the expected reason
        shell: bash
        run: |
          set -Eeuo pipefail

          temp_env_file="$RUNNER_TEMP/deploy-image-validation.env"

          {
            printf 'APP_IMAGE_TAG=%s\n' '__definitely_missing__'
            printf 'WORKER_IMAGE_TAG=%s\n' 'dev-latest'
          } > "$temp_env_file"

          set +e
          pull_output="$(
            ENV_FILE="$temp_env_file" docker compose \
              -f docker-compose.yml \
              -f docker-compose.remote.yml \
              --env-file "$temp_env_file" \
              pull app 2>&1
          )"
          pull_status=$?
          set -e

          if [ "$pull_status" -eq 0 ]; then
            echo "::error title=Validation failed::Expected docker compose pull to fail for the missing app image tag."
            echo "Expected docker compose pull to fail for a non-existent image tag."
            exit 1
          fi

          if ! printf '%s\n' "$pull_output" | grep -Eqi 'manifest unknown|no matching manifest|not found'; then
            echo "::error title=Unexpected pull failure::The missing-image pull failed for an unrelated reason."
            printf '%s\n' "$pull_output"
            exit 1
          fi

          echo "Expected failure observed for a missing deployment image tag."
