name: Worker Image GHCR

"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: Custom image tag to publish from dev
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: "worker-image-ghcr-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/respira-data-worker"

jobs:
  publish-worker-image:
    name: Publish worker image
    runs-on: ubuntu-latest
    if: "(github.event_name == 'workflow_dispatch' && github.ref_name == 'dev') || (github.event_name == 'release' && github.event.release.target_commitish == 'main')"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
