name: CI/CD Demo

run-name: Demo CI/CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy when skipping image publish"
        required: true
        type: string
        default: "dev-latest"
      publish_images:
        description: "Build and publish fresh dev images before deploy"
        required: true
        type: boolean
        default: false
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-cd-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Dev Images to GHCR
    if: ${{ github.event_name == 'push' || inputs.publish_images }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Validate dev branch
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "This workflow can only publish demo images from refs/heads/dev. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Normalize image owner
        id: normalize_owner
        shell: bash
        run: echo "image_owner_lc=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous dev-latest images from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PACKAGE_API_PREFIX="/orgs/${{ github.repository_owner }}/packages/container"

          delete_tag_from_image() {
            local image_name=$1
            echo "Deleting previous $image_name:dev-latest..."

            gh api \
              -X GET \
              "$PACKAGE_API_PREFIX/$image_name/versions" \
              --paginate \
              --jq '.[] | select(.tags[]? == "dev-latest") | .id' | \
              while read version_id; do
                if [ -n "$version_id" ]; then
                  echo "  Deleting version $version_id"
                  gh api -X DELETE "$PACKAGE_API_PREFIX/$image_name/versions/$version_id" || true
                fi
              done
          }

          delete_tag_from_image "respira-data-app"
          delete_tag_from_image "respira-data-worker"

          echo "Previous image deletion completed"
          set -e

      - name: Docker metadata app
        id: meta_app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-app
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=sha-

      - name: Docker metadata worker
        id: meta_worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-worker
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=sha-

      - name: Build and push app image
        id: push_app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha,scope=cicd-demo-app
          cache-to: type=gha,scope=cicd-demo-app,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Build and push worker image
        id: push_worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha,scope=cicd-demo-worker
          cache-to: type=gha,scope=cicd-demo-worker,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Generate app image attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-app
          subject-digest: ${{ steps.push_app.outputs.digest }}
          push-to-registry: true

      - name: Generate worker image attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-worker
          subject-digest: ${{ steps.push_worker.outputs.digest }}
          push-to-registry: true

  prepare-demo:
    name: Prepare Demo Deploy Context
    needs: [publish]
    if: ${{ always() && github.ref == 'refs/heads/dev' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Resolve image tag and validate branch
        id: set_tag
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"

          if [ "$branch" != "dev" ]; then
            echo "This deployment can only be executed from the dev branch."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_images }}" != "true" ]; then
            tag="${{ inputs.image_tag }}"
            if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "image_tag must be a valid Docker tag: start with [A-Za-z0-9_], then only [A-Za-z0-9_.-], max 128 chars"
              exit 1
            fi

            if [ "$tag" = "latest" ]; then
              echo "image_tag 'latest' is not allowed for demo deployment. Use 'dev-latest' or an immutable release/hotfix tag."
              exit 1
            fi
          else
            tag="dev-latest"
          fi

          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check authorization
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ALLOWED_USERS_DEMO: ${{ vars.DEPLOY_ALLOWED_USERS_DEMO }}
          CURRENT_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "$ALLOWED_USERS_DEMO" ]; then
            echo "DEPLOY_ALLOWED_USERS_DEMO variable is not configured"
            exit 1
          fi

          if echo "$ALLOWED_USERS_DEMO" | grep -Eq '(^|[[:space:],])'"$CURRENT_USER"'([[:space:],]|$)'; then
            echo "User $CURRENT_USER is authorized to deploy to Demo"
          else
            echo "User $CURRENT_USER is NOT authorized to deploy to Demo"
            exit 1
          fi

  deploy-demo:
    name: Deploy to Demo Server
    needs: [publish, prepare-demo]
    if: ${{ always() && github.ref == 'refs/heads/dev' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && needs.prepare-demo.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Demo
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH
        id: setup_ssh
        uses: ./.github/actions/prepare-ssh
        with:
          deploy_host: ${{ secrets.DEPLOY_HOST }}
          deploy_user: ${{ secrets.DEPLOY_USER }}
          deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy_host_key: ${{ secrets.DEPLOY_HOST_KEY }}
          environment_label: demo

      - name: Prepare env file
        id: write_env
        uses: ./.github/actions/prepare-env
        with:
          env_file_b64: ${{ secrets.ENV_FILE_DEMO }}
          environment_label: demo
          env_secret_name: ENV_FILE_DEMO
          env_file_suffix: env-demo
          required_keys: |
            REMOTE_PG_HOST
            REMOTE_PG_PORT
            REMOTE_PG_DB
            REMOTE_PG_USER
            REMOTE_PG_PASSWORD
            REMOTE_PG_SSLMODE
            PREFECT_API_URL
            MODEL_6H_PATH
            MODEL_12H_PATH

      - name: Copy compose and env files to server
        id: copy_files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_DATA }}
          KEY_PATH: ${{ steps.setup_ssh.outputs.key_path }}
          ENV_FILE: ${{ steps.write_env.outputs.env_file }}
        run: |
          set -euo pipefail

          echo "::group::Copy compose files to remote"
          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.yml \
            docker-compose.remote.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/"
          echo "::endgroup::"

          echo "::group::Copy immutable demo env file to remote"
          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$ENV_FILE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/.env.demo"
          echo "::endgroup::"

          echo "::group::Harden env file permissions on remote"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$COMPOSE_PATH/.env.demo'"
          echo "::endgroup::"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_DATA }}
          KEY_PATH: ${{ steps.setup_ssh.outputs.key_path }}
          IMAGE_TAG: ${{ needs.prepare-demo.outputs.image_tag }}
        run: |
          set -euo pipefail

          echo "::group::Execute remote docker compose deploy"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "export COMPOSE_PATH='$COMPOSE_PATH' APP_IMAGE_TAG='$IMAGE_TAG' WORKER_IMAGE_TAG='$IMAGE_TAG'; bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          compose_files="-f docker-compose.yml -f docker-compose.remote.demo.yml"

          print_deploy_diagnostics() {
            echo "Deployment diagnostics: docker compose ps"
            docker compose $compose_files --env-file .env.demo ps || true
            echo "Deployment diagnostics: last 120 log lines per service"
            docker compose $compose_files --env-file .env.demo logs --tail=120 || true
          }

          fail_deploy_step() {
            step_name="$1"
            message="$2"

            echo "::error title=Deployment failed::$step_name"
            echo "$message"
            print_deploy_diagnostics
            exit 1
          }

          get_image_digest() {
            image_id="$1"
            docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}none{{end}}' "$image_id"
          }

          capture_pulled_image_id() {
            service_name="$1"
            image_refs="$(docker compose $compose_files --env-file .env.demo config --images "$service_name")"
            IFS=$'\n' read -r image_ref _ <<< "$image_refs"

            if [ -z "$image_ref" ]; then
              fail_deploy_step "Resolve image reference for $service_name" "Failed to resolve the image reference for service $service_name."
            fi

            image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"

            if [ -z "$image_id" ]; then
              fail_deploy_step "Resolve pulled image for $service_name" "Failed to resolve the pulled image ID for service $service_name."
            fi

            echo "$image_id"
          }

          validate_running_image() {
            service_name="$1"
            expected_image_id="$2"

            container_id="$(docker compose $compose_files --env-file .env.demo ps -q "$service_name")"
            if [ -z "$container_id" ]; then
              fail_deploy_step "Validate $service_name image" "Service $service_name did not create a container."
            fi

            running_image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
            running_image_ref="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
            expected_image_digest="$(get_image_digest "$expected_image_id")"
            running_image_digest="$(get_image_digest "$running_image_id")"

            echo "$service_name expected_image_id=$expected_image_id expected_digest=$expected_image_digest running_image_id=$running_image_id running_digest=$running_image_digest image_ref=$running_image_ref"

            if [ "$running_image_id" != "$expected_image_id" ]; then
              fail_deploy_step "Validate $service_name image" "Deployment validation failed for $service_name: running container image does not match the pulled image. Expected image ID: $expected_image_id; running image ID: $running_image_id; resolved image ref: $running_image_ref; expected digest: $expected_image_digest; running digest: $running_image_digest."
            fi

            if [ "$expected_image_digest" != "none" ] && [ "$running_image_digest" != "$expected_image_digest" ]; then
              fail_deploy_step "Validate $service_name image" "Deployment validation failed for $service_name: running image digest does not match the pulled image digest. Expected digest: $expected_image_digest; running digest: $running_image_digest; resolved image ref: $running_image_ref."
            fi
          }

          deploy_phase="Initializing deployment"

          on_deploy_error() {
            exit_code=$?
            echo "::error title=Deployment failed::$deploy_phase"
            echo "Remote deploy command failed during: $deploy_phase"
            print_deploy_diagnostics
            exit "$exit_code"
          }
          trap on_deploy_error ERR

          if [ -z "$COMPOSE_PATH" ] || [ ! -d "$COMPOSE_PATH" ]; then
            echo "Invalid DEPLOY_COMPOSE_PATH_DATA configured for demo environment."
            exit 1
          fi

          cd "$COMPOSE_PATH"

          # Keep repository file unchanged; adjust fallback tag only in deployed copy.
          cp docker-compose.remote.yml docker-compose.remote.demo.yml
          sed -i \
            -e 's/\${APP_IMAGE_TAG:-latest}/\${APP_IMAGE_TAG:-dev-latest}/g' \
            -e 's/\${WORKER_IMAGE_TAG:-latest}/\${WORKER_IMAGE_TAG:-dev-latest}/g' \
            docker-compose.remote.demo.yml

          deploy_phase="[1/3] Pull app and worker images"
          echo "$deploy_phase"
          docker compose \
            $compose_files \
            --env-file .env.demo \
            pull app worker

          app_expected_image_id="$(capture_pulled_image_id app)"
          worker_expected_image_id="$(capture_pulled_image_id worker)"

          deploy_phase="[2/3] Recreate the stack from the pulled images"
          echo "$deploy_phase"
          docker compose \
            $compose_files \
            --env-file .env.demo \
            up --force-recreate --remove-orphans --wait --wait-timeout 600

          deploy_phase="[3/3] Validate the running containers use the pulled images"
          echo "$deploy_phase"
          validate_running_image app "$app_expected_image_id"
          validate_running_image worker "$worker_expected_image_id"

          echo "Deployment image validation completed successfully."

          echo "Running shared metadata sync..."
          docker compose \
            $compose_files \
            --env-file .env.demo \
            run --rm --no-deps app bash -lc '
              set -euo pipefail
              cd /app/dbt
              target="${DBT_TARGET:-prod}"
              dbt deps
              dbt seed --target "$target" --selector shared_core_seed
              dbt test --target "$target" --selector shared_core_seed_tests
              dbt run --target "$target" --selector canonical_core
            '

          docker system prune -af
          docker image prune -af
          docker builder prune -af
          REMOTE_SCRIPT
          echo "::endgroup::"

      - name: Post-deploy summary
        run: |
          echo "Deployment of respira-data to Demo completed on remote server."
