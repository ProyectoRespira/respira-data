name: "Deploy Demo from Release/Hotfix"

on:
  push:
    branches:
      - release/*
      - hotfix/*
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: demo-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Release/Hotfix Branch
    if: ${{ github.repository == 'ProyectoRespira/respira-data' }}
    runs-on: ubuntu-latest
    outputs:
      branch_tag: ${{ steps.extract_tag.outputs.tag }}
      prefixed_tag: ${{ steps.extract_tag.outputs.prefixed_tag }}
      branch_type: ${{ steps.extract_tag.outputs.branch_type }}
    steps:
      - name: Extract and validate branch tag
        id: extract_tag
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Expected branch names:
          # release/vX.Y.Z
          # hotfix/vX.Y.Z
          if [[ "$BRANCH_NAME" =~ ^(release|hotfix)/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BRANCH_TYPE="${BASH_REMATCH[1]}"
            BRANCH_TAG="${BASH_REMATCH[2]}"
          else
            echo "Branch must match pattern: release/vX.Y.Z or hotfix/vX.Y.Z"
            echo "Current branch: $BRANCH_NAME"
            exit 1
          fi

          echo "branch_type=$BRANCH_TYPE" >> "$GITHUB_OUTPUT"
          echo "tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "prefixed_tag=${BRANCH_TYPE}-${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "Validated branch: $BRANCH_NAME -> ${BRANCH_TYPE}-${BRANCH_TAG}"

  publish:
    name: Publish Images to GHCR
    needs: validate
    if: ${{ github.repository == 'ProyectoRespira/respira-data' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ needs.validate.outputs.branch_tag }}
      PREFIXED_TAG: ${{ needs.validate.outputs.prefixed_tag }}

    steps:
      - name: Normalize image owner
        id: normalize_owner
        shell: bash
        run: |
          set -euo pipefail
          echo "image_owner_lc=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata app
        id: meta_app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-app
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.PREFIXED_TAG }}
            type=sha,prefix=sha-

      - name: Docker metadata worker
        id: meta_worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-worker
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.PREFIXED_TAG }}
            type=sha,prefix=sha-

      - name: Build and push app image
        id: push_app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha,scope=release-hotfix-demo-app
          cache-to: type=gha,scope=release-hotfix-demo-app,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Build and push worker image
        id: push_worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha,scope=release-hotfix-demo-worker
          cache-to: type=gha,scope=release-hotfix-demo-worker,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Generate app image attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-app
          subject-digest: ${{ steps.push_app.outputs.digest }}
          push-to-registry: true

      - name: Generate worker image attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-worker
          subject-digest: ${{ steps.push_worker.outputs.digest }}
          push-to-registry: true

  deploy-demo:
    name: Deploy to Demo Server
    needs: [validate, publish]
    if: ${{ github.repository == 'ProyectoRespira/respira-data' }}
    runs-on: ubuntu-latest
    environment: Demo
    steps:
      - name: Check authorization
        shell: bash
        env:
          ALLOWED_USERS_DEMO: ${{ vars.DEPLOY_ALLOWED_USERS_DEMO }}
          CURRENT_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "$ALLOWED_USERS_DEMO" ]; then
            echo "DEPLOY_ALLOWED_USERS_DEMO variable is not configured"
            exit 1
          fi

          if echo "$ALLOWED_USERS_DEMO" | grep -Eq '(^|[[:space:],])'"$CURRENT_USER"'([[:space:],]|$)'; then
            echo "User $CURRENT_USER is authorized to deploy to Demo"
          else
            echo "User $CURRENT_USER is NOT authorized to deploy to Demo"
            exit 1
          fi

      - name: Validate SSH configuration
        id: prepare_ssh_key
        shell: bash
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          echo "::add-mask::$DEPLOY_HOST_VALUE"
          echo "::add-mask::$DEPLOY_USER_VALUE"
          echo "::add-mask::$DEPLOY_SSH_KEY_VALUE"

          if [ -z "$DEPLOY_HOST_VALUE" ]; then
            echo "Missing DEPLOY_HOST secret for demo environment."
            exit 1
          fi

          if [ -z "$DEPLOY_USER_VALUE" ]; then
            echo "Missing DEPLOY_USER secret for demo environment."
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY_VALUE" ]; then
            echo "Missing DEPLOY_SSH_KEY secret for demo environment."
            exit 1
          fi

          tmp_key="$RUNNER_TEMP/deploy_ssh_key"
          if printf '%s' "$DEPLOY_SSH_KEY_VALUE" | grep -q '\\n'; then
            printf '%b' "$DEPLOY_SSH_KEY_VALUE" > "$tmp_key"
          else
            printf '%s\n' "$DEPLOY_SSH_KEY_VALUE" > "$tmp_key"
          fi
          chmod 600 "$tmp_key"

          if ! grep -q 'BEGIN .*PRIVATE KEY' "$tmp_key"; then
            echo "DEPLOY_SSH_KEY does not look like a valid private key for demo environment."
            exit 1
          fi

          if ! ssh-keygen -y -f "$tmp_key" >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY could not be parsed for demo environment."
            echo "It may be malformed, for a different key type, or encrypted with a passphrase."
            exit 1
          fi

          echo "key_path=$tmp_key" >> "$GITHUB_OUTPUT"

      - name: Validate and write env file
        id: write_env
        shell: bash
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_DEMO }}
        run: |
          set -euo pipefail

          if [ -z "$ENV_FILE_B64" ]; then
            echo "Missing ENV_FILE_DEMO secret"
            exit 1
          fi

          env_file="$RUNNER_TEMP/env-demo"
          printf '%s' "$ENV_FILE_B64" | base64 --decode > "$env_file"

          required_keys=(
            REMOTE_PG_HOST
            REMOTE_PG_PORT
            REMOTE_PG_DB
            REMOTE_PG_USER
            REMOTE_PG_PASSWORD
            REMOTE_PG_SSLMODE
            PREFECT_API_URL
            MODEL_6H_PATH
            MODEL_12H_PATH
          )

          missing=()
          for key in "${required_keys[@]}"; do
            val="$(grep -E "^${key}=" "$env_file" | head -n1 | cut -d'=' -f2- | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
            if [ -z "$val" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required keys in ENV_FILE_DEMO:"
            for k in "${missing[@]}"; do echo "- $k"; done
            exit 1
          fi

          echo "env_file=$env_file" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Copy compose and env files to server
        id: copy_files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_DATA }}
          KEY_PATH: ${{ steps.prepare_ssh_key.outputs.key_path }}
          ENV_FILE: ${{ steps.write_env.outputs.env_file }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "Missing required DEPLOY_HOST_KEY secret in Demo environment."
            exit 1
          fi

          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.yml \
            docker-compose.remote.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/"

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$ENV_FILE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/.env.demo"

      - name: Deploy over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_DATA }}
          KEY_PATH: ${{ steps.prepare_ssh_key.outputs.key_path }}
          IMAGE_TAG: ${{ needs.validate.outputs.prefixed_tag }}
        run: |
          set -euo pipefail

          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "export COMPOSE_PATH='$COMPOSE_PATH' APP_IMAGE_TAG='$IMAGE_TAG' WORKER_IMAGE_TAG='$IMAGE_TAG'; bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if [ -z "$COMPOSE_PATH" ] || [ ! -d "$COMPOSE_PATH" ]; then
            echo "Invalid DEPLOY_COMPOSE_PATH_DATA for Demo"
            exit 1
          fi

          if [ -z "$APP_IMAGE_TAG" ] || [ -z "$WORKER_IMAGE_TAG" ]; then
            echo "One or more image tags are empty"
            exit 1
          fi

          cd "$COMPOSE_PATH"

          docker pull "ghcr.io/proyectorespira/respira-data-app:${APP_IMAGE_TAG}"
          docker pull "ghcr.io/proyectorespira/respira-data-worker:${WORKER_IMAGE_TAG}"

          APP_IMAGE_TAG="$APP_IMAGE_TAG" \
          WORKER_IMAGE_TAG="$WORKER_IMAGE_TAG" \
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.remote.yml \
            --env-file .env.demo \
            up -d --pull always --remove-orphans

          docker compose ps
          REMOTE_SCRIPT

      - name: Summary
        shell: bash
        run: |
          echo "Demo deployment for ${{ github.ref_name }} completed."
