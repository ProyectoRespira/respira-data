name: "Deploy Demo from Release/Hotfix"

on:
  push:
    branches:
      - release/*
      - hotfix/*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Release/Hotfix Branch
    if: ${{ github.repository == 'ProyectoRespira/respira-data' }}
    runs-on: ubuntu-latest
    outputs:
      branch_tag: ${{ steps.extract_tag.outputs.tag }}
      prefixed_tag: ${{ steps.extract_tag.outputs.prefixed_tag }}
      branch_type: ${{ steps.extract_tag.outputs.branch_type }}
    steps:
      - name: Extract and validate branch tag
        id: extract_tag
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Expected branch names:
          # release/vX.Y.Z
          # hotfix/vX.Y.Z
          if [[ "$BRANCH_NAME" =~ ^(release|hotfix)/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BRANCH_TYPE="${BASH_REMATCH[1]}"
            BRANCH_TAG="${BASH_REMATCH[2]}"
          else
            echo "Branch must match pattern: release/vX.Y.Z or hotfix/vX.Y.Z"
            echo "Current branch: $BRANCH_NAME"
            exit 1
          fi

          echo "branch_type=$BRANCH_TYPE" >> "$GITHUB_OUTPUT"
          echo "tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "prefixed_tag=${BRANCH_TYPE}-${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "Validated branch: $BRANCH_NAME -> ${BRANCH_TYPE}-${BRANCH_TAG}"

  publish:
    name: Publish Images to GHCR
    needs: validate
    if: ${{ github.repository == 'ProyectoRespira/respira-data' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ needs.validate.outputs.branch_tag }}
      PREFIXED_TAG: ${{ needs.validate.outputs.prefixed_tag }}

    steps:
      - name: Normalize image owner
        id: normalize_owner
        shell: bash
        run: |
          set -euo pipefail
          echo "image_owner_lc=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata app
        id: meta_app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-app
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.PREFIXED_TAG }}
            type=sha,prefix=sha-

      - name: Docker metadata worker
        id: meta_worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-worker
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.PREFIXED_TAG }}
            type=sha,prefix=sha-

      - name: Build and push app image
        id: push_app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha,scope=release-hotfix-demo-app
          cache-to: type=gha,scope=release-hotfix-demo-app,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Build and push worker image
        id: push_worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha,scope=release-hotfix-demo-worker
          cache-to: type=gha,scope=release-hotfix-demo-worker,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Generate app image attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-app
          subject-digest: ${{ steps.push_app.outputs.digest }}
          push-to-registry: true

      - name: Generate worker image attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-data-worker
          subject-digest: ${{ steps.push_worker.outputs.digest }}
          push-to-registry: true

  authorize-demo:
    name: Authorize Demo Deployment Actor
    needs: validate
    if: ${{ github.repository == 'ProyectoRespira/respira-data' }}
    runs-on: ubuntu-latest
    environment: Demo
    steps:
      - name: Check authorization
        shell: bash
        env:
          ALLOWED_USERS_DEMO: ${{ vars.DEPLOY_ALLOWED_USERS_DEMO }}
          CURRENT_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "$ALLOWED_USERS_DEMO" ]; then
            echo "DEPLOY_ALLOWED_USERS_DEMO variable is not configured"
            exit 1
          fi

          if echo "$ALLOWED_USERS_DEMO" | grep -Eq '(^|[[:space:],])'"$CURRENT_USER"'([[:space:],]|$)'; then
            echo "User $CURRENT_USER is authorized to deploy to Demo"
          else
            echo "User $CURRENT_USER is NOT authorized to deploy to Demo"
            exit 1
          fi

  deploy-demo:
    name: Deploy to Demo Server
    needs: [validate, publish, authorize-demo]
    if: ${{ github.repository == 'ProyectoRespira/respira-data' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Demo
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH
        id: setup_ssh
        uses: ./.github/actions/prepare-ssh
        with:
          deploy_host: ${{ secrets.DEPLOY_HOST }}
          deploy_user: ${{ secrets.DEPLOY_USER }}
          deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy_host_key: ${{ secrets.DEPLOY_HOST_KEY }}
          environment_label: demo

      - name: Prepare env file
        id: write_env
        uses: ./.github/actions/prepare-env
        with:
          env_file_b64: ${{ secrets.ENV_FILE_DEMO }}
          environment_label: demo
          env_secret_name: ENV_FILE_DEMO
          env_file_suffix: env-demo
          required_keys: |
            REMOTE_PG_HOST
            REMOTE_PG_PORT
            REMOTE_PG_DB
            REMOTE_PG_USER
            REMOTE_PG_PASSWORD
            REMOTE_PG_SSLMODE
            PREFECT_API_URL
            MODEL_6H_PATH
            MODEL_12H_PATH

      - name: Copy compose and env files to server
        id: copy_files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_DATA }}
          KEY_PATH: ${{ steps.setup_ssh.outputs.key_path }}
          ENV_FILE: ${{ steps.write_env.outputs.env_file }}
        run: |
          set -euo pipefail

          echo "::group::Copy compose files to remote"
          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.yml \
            docker-compose.remote.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/"
          echo "::endgroup::"

          echo "::group::Copy immutable demo env file to remote"
          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$ENV_FILE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/.env.demo"
          echo "::endgroup::"

          echo "::group::Harden env file permissions on remote"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$COMPOSE_PATH/.env.demo'"
          echo "::endgroup::"

      - name: Deploy over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_DATA }}
          KEY_PATH: ${{ steps.setup_ssh.outputs.key_path }}
          IMAGE_TAG: ${{ needs.validate.outputs.prefixed_tag }}
        run: |
          set -euo pipefail

          echo "::group::Execute remote docker compose deploy"
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "export COMPOSE_PATH='$COMPOSE_PATH' APP_IMAGE_TAG='$IMAGE_TAG' WORKER_IMAGE_TAG='$IMAGE_TAG'; bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          compose_files="-f docker-compose.yml -f docker-compose.remote.yml"

          print_deploy_diagnostics() {
            echo "Deployment diagnostics: docker compose ps"
            APP_IMAGE_TAG="$APP_IMAGE_TAG" WORKER_IMAGE_TAG="$WORKER_IMAGE_TAG" docker compose $compose_files --env-file .env.demo ps || true
            echo "Deployment diagnostics: last 120 log lines per service"
            APP_IMAGE_TAG="$APP_IMAGE_TAG" WORKER_IMAGE_TAG="$WORKER_IMAGE_TAG" docker compose $compose_files --env-file .env.demo logs --tail=120 || true
          }

          fail_deploy_step() {
            step_name="$1"
            message="$2"

            echo "::error title=Deployment failed::$step_name"
            echo "$message"
            print_deploy_diagnostics
            exit 1
          }

          get_image_digest() {
            image_id="$1"
            docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}none{{end}}' "$image_id"
          }

          capture_pulled_image_id() {
            service_name="$1"
            image_refs="$(APP_IMAGE_TAG="$APP_IMAGE_TAG" WORKER_IMAGE_TAG="$WORKER_IMAGE_TAG" docker compose $compose_files --env-file .env.demo config --images "$service_name")"
            IFS=$'\n' read -r image_ref _ <<< "$image_refs"

            if [ -z "$image_ref" ]; then
              fail_deploy_step "Resolve image reference for $service_name" "Failed to resolve the image reference for service $service_name."
            fi

            image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"

            if [ -z "$image_id" ]; then
              fail_deploy_step "Resolve pulled image for $service_name" "Failed to resolve the pulled image ID for service $service_name."
            fi

            echo "$image_id"
          }

          validate_running_image() {
            service_name="$1"
            expected_image_id="$2"

            container_id="$(APP_IMAGE_TAG="$APP_IMAGE_TAG" WORKER_IMAGE_TAG="$WORKER_IMAGE_TAG" docker compose $compose_files --env-file .env.demo ps -q "$service_name")"
            if [ -z "$container_id" ]; then
              fail_deploy_step "Validate $service_name image" "Service $service_name did not create a container."
            fi

            running_image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
            running_image_ref="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
            expected_image_digest="$(get_image_digest "$expected_image_id")"
            running_image_digest="$(get_image_digest "$running_image_id")"

            echo "$service_name expected_image_id=$expected_image_id expected_digest=$expected_image_digest running_image_id=$running_image_id running_digest=$running_image_digest image_ref=$running_image_ref"

            if [ "$running_image_id" != "$expected_image_id" ]; then
              fail_deploy_step "Validate $service_name image" "Deployment validation failed for $service_name: running container image does not match the pulled image. Expected image ID: $expected_image_id; running image ID: $running_image_id; resolved image ref: $running_image_ref; expected digest: $expected_image_digest; running digest: $running_image_digest."
            fi

            if [ "$expected_image_digest" != "none" ] && [ "$running_image_digest" != "$expected_image_digest" ]; then
              fail_deploy_step "Validate $service_name image" "Deployment validation failed for $service_name: running image digest does not match the pulled image digest. Expected digest: $expected_image_digest; running digest: $running_image_digest; resolved image ref: $running_image_ref."
            fi
          }

          deploy_phase="Initializing deployment"

          on_deploy_error() {
            exit_code=$?
            echo "::error title=Deployment failed::$deploy_phase"
            echo "Remote deploy command failed during: $deploy_phase"
            print_deploy_diagnostics
            exit "$exit_code"
          }
          trap on_deploy_error ERR

          if [ -z "$COMPOSE_PATH" ] || [ ! -d "$COMPOSE_PATH" ]; then
            echo "Invalid DEPLOY_COMPOSE_PATH_DATA for Demo"
            exit 1
          fi

          if [ -z "$APP_IMAGE_TAG" ] || [ -z "$WORKER_IMAGE_TAG" ]; then
            echo "One or more image tags are empty"
            exit 1
          fi

          cd "$COMPOSE_PATH"

          deploy_phase="[1/3] Pull app and worker images"
          echo "$deploy_phase"
          APP_IMAGE_TAG="$APP_IMAGE_TAG" WORKER_IMAGE_TAG="$WORKER_IMAGE_TAG" docker compose \
            $compose_files \
            --env-file .env.demo \
            pull app worker

          app_expected_image_id="$(capture_pulled_image_id app)"
          worker_expected_image_id="$(capture_pulled_image_id worker)"

          deploy_phase="[2/3] Recreate the stack from the pulled images"
          echo "$deploy_phase"
          APP_IMAGE_TAG="$APP_IMAGE_TAG" WORKER_IMAGE_TAG="$WORKER_IMAGE_TAG" docker compose \
            $compose_files \
            --env-file .env.demo \
            up --force-recreate --remove-orphans --wait --wait-timeout 600

          deploy_phase="[3/3] Validate the running containers use the pulled images"
          echo "$deploy_phase"
          validate_running_image app "$app_expected_image_id"
          validate_running_image worker "$worker_expected_image_id"

          echo "Deployment image validation completed successfully."

          echo "Running shared metadata sync..."
          APP_IMAGE_TAG="$APP_IMAGE_TAG" WORKER_IMAGE_TAG="$WORKER_IMAGE_TAG" docker compose \
            $compose_files \
            --env-file .env.demo \
            run --rm --no-deps app bash -lc '
              set -euo pipefail
              cd /app/dbt
              target="${DBT_TARGET:-prod}"
              dbt deps
              dbt seed --target "$target" --selector shared_core_seed
              dbt test --target "$target" --selector shared_core_seed_tests
              dbt run --target "$target" --selector canonical_core
            '
          REMOTE_SCRIPT
          echo "::endgroup::"

      - name: Summary
        shell: bash
        run: |
          echo "Demo deployment for ${{ github.ref_name }} completed."
