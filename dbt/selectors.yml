selectors:
  - name: canonical_core
    description: Canonical staging, intermediate, and core models.
    definition:
      union:
        - method: path
          value: models/canonical/staging
        - method: path
          value: models/canonical/intermediate
        - method: path
          value: models/canonical/core

  - name: canonical_silver
    description: Canonical silver models.
    definition:
      method: path
      value: models/canonical/silver

  - name: canonical_incremental_state
    description: Refresh production measurement stream state after a successful incremental silver publish.
    definition:
      method: path
      value: models/canonical/ops/measurement_stream_state.sql

  - name: canonical_incremental_core
    description: Canonical runtime core path for normal incrementals. Refreshes persisted FIUNA repair and station caches while skipping pure staging views.
    definition:
      union:
        - method: path
          value: models/canonical/staging/stg_mades_open_stations_cache.sql
        - method: path
          value: models/canonical/staging/stg_respira_stations_cache.sql
        - method: path
          value: models/canonical/staging/stg_fiuna_measurements_repaired.sql
        - method: path
          value: models/canonical/intermediate
        - method: path
          value: models/canonical/core

  - name: canonical_batch_prep
    description: Stateless staging and prerequisite canonical dimensions for measurement backfills. FIUNA repaired/public staging runs in scoped batch ingest.
    definition:
      union:
        - method: path
          value: models/canonical/staging
        - method: path
          value: models/canonical/intermediate/int_stations_candidates.sql
        - method: path
          value: models/canonical/core/dim_organizations.sql
        - method: path
          value: models/canonical/core/dim_data_sources.sql
        - method: path
          value: models/canonical/core/dim_variables.sql
        - method: path
          value: models/canonical/core/dim_stations.sql
        - exclude:
            - method: path
              value: models/canonical/staging/stg_fiuna_measurements_repaired.sql
            - method: path
              value: models/canonical/staging/stg_fiuna_measurements.sql

  - name: canonical_batch_ingest
    description: Source-row ingest path for batched measurement backfills, including scoped FIUNA repair and its public staging view.
    definition:
      union:
        - method: path
          value: models/canonical/staging/stg_fiuna_measurements_repaired.sql
        - method: path
          value: models/canonical/staging/stg_fiuna_measurements.sql
        - method: path
          value: models/canonical/intermediate/int_measurement_timestamps_silver.sql
        - method: path
          value: models/canonical/intermediate/int_streams_candidates.sql
        - method: path
          value: models/canonical/core/dim_streams.sql

  - name: canonical_batch_payload_audit
    description: Optional raw payload audit path for batched measurement backfills.
    definition:
      method: path
      value: models/canonical/intermediate/int_measurement_payloads.sql

  - name: canonical_batch_process
    description: Post-validation measured-time processing path for batched measurement backfills.
    definition:
      union:
        - method: path
          value: models/canonical/intermediate/int_measurements_long.sql
        - method: path
          value: models/canonical/intermediate/int_measurements_values_silver.sql
        - method: path
          value: models/canonical/silver/fct_measurements_silver.sql

  - name: canonical_batch_smoke_tests
    description: Source-scoped smoke tests for measurement backfills.
    definition:
      intersection:
        - method: resource_type
          value: test
        - method: path
          value: tests/batch_smoke

  - name: canonical_shadow_state
    description: Reset or incrementally refresh the isolated shadow stream state.
    definition:
      method: path
      value: models/canonical/shadow/measurement_stream_state_shadow.sql

  - name: canonical_shadow_publish
    description: Publish validation rows to isolated shadow silver; ephemeral long/value dependencies compile inline.
    definition:
      method: path
      value: models/canonical/shadow/fct_measurements_silver_shadow.sql

  - name: canonical_shadow_tests
    description: Contract tests for the persisted shadow silver and stream-state outputs.
    definition:
      union:
        - intersection:
            - method: resource_type
              value: test
            - method: path
              value: models/canonical/shadow
        - method: path
          value: tests/shadow

  - name: project_respira_gold
    description: respira_gold project models.
    definition:
      method: path
      value: models/projects/respira_gold

  - name: project_respira_gold_seed
    description: respira_gold project-scoped seeds.
    definition:
      intersection:
        - method: resource_type
          value: seed
        - method: path
          value: seeds/projects/respira_gold

  - name: project_respira_gold_seed_tests
    description: Blocking tests for respira_gold project-scoped seeds.
    definition:
      union:
        - intersection:
            - method: resource_type
              value: test
            - method: path
              value: seeds/projects/respira_gold
        - intersection:
            - method: resource_type
              value: test
            - method: path
              value: tests/respira_gold_seeds

  - name: shared_core_seed
    description: Shared core metadata seeds (seed CSVs in dbt/seeds/, excluding per-project seeds under dbt/seeds/projects/).
    definition:
      union:
        - method: path
          value: seeds/calibration_factors_seed.csv
          indirect_selection: empty
        - method: path
          value: seeds/data_sources.csv
          indirect_selection: empty
        - method: path
          value: seeds/organizations.csv
          indirect_selection: empty
        - method: path
          value: seeds/project_data_sources.csv
          indirect_selection: empty
        - method: path
          value: seeds/project_organizations.csv
          indirect_selection: empty
        - method: path
          value: seeds/projects.csv
          indirect_selection: empty
        - method: path
          value: seeds/regions_seed.csv
          indirect_selection: empty
        - method: path
          value: seeds/station_region_seed.csv
          indirect_selection: empty
        - method: path
          value: seeds/stations_static.csv
          indirect_selection: empty
        - method: path
          value: seeds/variable_rules.csv
          indirect_selection: empty
        - method: path
          value: seeds/variables.csv
          indirect_selection: empty

  - name: shared_core_seed_tests
    description: Tests attached to shared core seeds, excluding project-scoped seed tests.
    definition:
      union:
        - method: path
          value: seeds/calibration_factors_seed.csv
          indirect_selection: cautious
        - method: path
          value: seeds/data_sources.csv
          indirect_selection: cautious
        - method: path
          value: seeds/organizations.csv
          indirect_selection: cautious
        - method: path
          value: seeds/project_data_sources.csv
          indirect_selection: cautious
        - method: path
          value: seeds/project_organizations.csv
          indirect_selection: cautious
        - method: path
          value: seeds/projects.csv
          indirect_selection: cautious
        - method: path
          value: seeds/regions_seed.csv
          indirect_selection: cautious
        - method: path
          value: seeds/station_region_seed.csv
          indirect_selection: cautious
        - method: path
          value: seeds/stations_static.csv
          indirect_selection: cautious
        - method: path
          value: seeds/variable_rules.csv
          indirect_selection: cautious
        - method: path
          value: seeds/variables.csv
          indirect_selection: cautious

  - name: project_respira_gold_tests
    description: Data tests scoped to respira_gold project models.
    definition:
      union:
        - intersection:
            - method: resource_type
              value: test
            - method: path
              value: models/projects/respira_gold
        - intersection:
            - method: resource_type
              value: test
            - method: path
              value: tests/respira_gold

  - name: canonical_full_refresh
    description: Safe full-refresh scope for canonical models.
    definition:
      union:
        - method: path
          value: models/canonical/staging
        - method: path
          value: models/canonical/intermediate
        - method: path
          value: models/canonical/core
        - method: path
          value: models/canonical/silver
