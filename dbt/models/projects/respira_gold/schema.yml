version: 2

models:
  - name: int_station_status_overrides
    description: "Project-scoped manual shutdown overrides for eligible air-quality stations, read from respira_webapp.station_overrides."
    columns:
      - name: core_station_id
        tests: [not_null]
      - name: station_code
        tests: [not_null, unique]
      - name: status
        tests:
          # Downstream, a row being present means "force this station inactive",
          # so nothing else may reach this model. Carried over from the seed's
          # schema when station_status_seed.csv was retired.
          - not_null
          - accepted_values:
              arguments:
                values: ['inactive']

  - name: int_station_id_map
    description: "Internal mapping from canonical station ids to sequential respira_gold station ids."
    columns:
      - name: core_station_id
        tests: [not_null, unique]
      - name: project_station_id
        tests: [not_null, unique]
      - name: station_code
        tests: [not_null, unique]

  - name: int_region_weather_stations
    description: "Internal one-to-one mapping from each region to its nearest available weather station, anchored on assigned air-quality stations or the region bbox center."
    columns:
      - name: region_code
        tests: [not_null, unique]
      - name: station_code
        tests: [not_null]

  - name: regions
    description: "Gold regions table exposed to backend (generated or seeded)."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: region_code
        tests: [not_null, unique]
      - name: name
        tests: [not_null]

  - name: stations
    description: "Gold stations table exposed to backend (air quality stations only)."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: station_code
        description: "Stable natural key (dim_stations.code). The Backoffice writes station_overrides against it."
        tests: [not_null, unique]
      - name: region_id
        tests:
          - relationships:
              arguments:
                to: ref('regions')
                field: id
      - name: name
        tests: [not_null]
      - name: is_station_on
        tests: [not_null]
      - name: is_pattern_station
        tests: [not_null]

  - name: weather_stations
    description: "Gold weather stations table (meteostat stations)."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: region_id
        tests:
          - relationships:
              arguments:
                to: ref('regions')
                field: id

  - name: station_readings_gold
    description: "Hourly station readings with calibration, AQI derived from rolling 24-hour PM averages, and rolling stats."
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stations')
                field: id
      - name: date_localtime
        tests: [not_null]
      - name: pm1
        tests: [not_null]
      - name: pm2_5
        tests: [not_null]
      - name: pm10
        tests: [not_null]
      - name: pm2_5_skew_6h
        tests: [not_null]
      - name: aqi_pm2_5
        tests: [not_null]
      - name: aqi_pm10
        tests: [not_null]
      - name: aqi_level
        tests: [not_null]
      - name: aqi_pm2_5_skew_24h
        tests: [not_null]

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ["station_id", "date_localtime"]
      - dbt_utils.sequential_values:
          arguments:
            column_name: date_localtime
            interval: 1
            datepart: hour
            group_by_columns: ["station_id"]

  - name: region_readings_gold
    description: "Hourly region aggregations derived from station_readings_gold, using each station's latest reading within a bounded carry-forward window."
    columns:
      - name: region_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('regions')
                field: id
      - name: date_utc
        tests: [not_null]
      - name: pm2_5_region_skew
        tests: [not_null]
      - name: aqi_region_skew
        tests: [not_null]

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ["region_id", "date_utc"]

  - name: station_inference_features
    description: "Incremental feature table for inference models (station + region + weather)."
    columns:
      - name: station_id
        tests: [not_null]
      - name: date_utc
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ["station_id", "date_utc"]

  - name: measurements_silver_wide
    description: "Project-scoped wide view over canonical silver measurements."

  - name: inference_runs
    description: "(Optional) Inference runs table for backend contract. Disabled by default."
  - name: inference_results
    description: "(Optional) Inference results table for backend contract. Disabled by default."
