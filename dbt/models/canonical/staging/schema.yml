version: 2

models:
  - name: stg_fiuna_measurements_raw
    description: "Raw FIUNA parse/normalize view over the ten Airbyte station tables. Timestamp repair is intentionally deferred to stg_fiuna_measurements_repaired."
    columns:
      - name: _airbyte_raw_id
        tests: [not_null, unique]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["fiuna_airbyte"]
      - name: station_code
        tests: [not_null]
      - name: cursor_id
        description: "FIUNA continuity cursor (source-of-truth ID)."
        tests: [not_null]
      - name: measured_at_raw
        tests: [not_null]
      - name: measured_at_parsed
        description: "Parsed timestamp in UTC."
      - name: is_measured_at_valid
        tests: [not_null]
      - name: raw_payload
        tests: [not_null]
      - name: pm1
      - name: pm25
      - name: pm10
      - name: battery
      - name: hum
      - name: pres
      - name: temperature_c

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["station_code", "cursor_id"]

  - name: stg_fiuna_measurements_repaired
    description: "Persisted FIUNA staging state. Repairs invalid timestamps by station and cursor_id and supplies continuity anchors to later extraction batches."
    columns:
      - name: _airbyte_raw_id
        tests: [not_null, unique]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["fiuna_airbyte"]
      - name: station_code
        tests: [not_null]
      - name: cursor_id
        description: "FIUNA continuity cursor (source-of-truth ID)."
        tests: [not_null]
      - name: measured_at_parsed
        description: "Parsed timestamp before continuity repair."
      - name: is_measured_at_valid
        tests: [not_null]
      - name: measured_at_silver
        description: "Canonical FIUNA timestamp after cursor-based repair."
      - name: is_time_imputed
        tests: [not_null]
      - name: time_impute_method
        tests:
          - accepted_values:
              arguments:
                values: ["fiuna_id_5min", "unfixable_no_anchor"]
      - name: raw_payload
        tests: [not_null]
      - name: pm1
      - name: pm25
      - name: pm10
      - name: battery
      - name: hum
      - name: pres
      - name: temperature_c

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["station_code", "cursor_id"]

  - name: stg_fiuna_measurements
    description: "Public FIUNA staging view over the persisted repaired table. Preserves raw row identity and wide measurements while exposing prepared canonical time fields."
    columns:
      - name: _airbyte_raw_id
        tests: [not_null, unique]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["fiuna_airbyte"]
      - name: station_code
        tests: [not_null]
      - name: cursor_id
        tests: [not_null]
      - name: measured_at_silver
      - name: is_time_imputed
        tests: [not_null]
      - name: time_impute_method
      - name: raw_payload
        tests: [not_null]
      - name: pm1
      - name: pm25
      - name: pm10
      - name: battery
      - name: hum
      - name: pres
      - name: temperature_c

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["station_code", "cursor_id"]

  - name: stg_airelibre_measurements
    description: "Staging view for AireLibre Airbyte table. Uses recorded as timestamp, no reliable cursor_id."
    columns:
      - name: _airbyte_raw_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              values: ["airelibre_airbyte"]
      - name: station_code
        tests: [not_null]
      - name: measured_at_raw
      - name: measured_at_parsed
      - name: is_measured_at_valid
        tests: [not_null]
      - name: raw_payload
        tests: [not_null]

  - name: stg_mades_open_stations_cache
    description: "Persisted staging cache for MADES Open stations. Reads directly from the Airbyte source, normalizes station metadata, and keeps the last known row per source_station_id so downstream models do not depend on the raw table retaining historical rows."
    columns:
      - name: _airbyte_raw_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              values: ["mades_open_airbyte"]
      - name: source_station_id
        tests: [not_null, unique]
      - name: station_code
        tests: [not_null]
      - name: raw_payload
        tests: [not_null]

  - name: stg_mades_open_measurements
    description: "Staging view for MADES Open PM10/PM2.5 Airbyte tables. Joins canonical station metadata and exposes pm10/pm25."
    columns:
      - name: source_row_id
        tests: [not_null, unique]
      - name: _airbyte_raw_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              values: ["mades_open_airbyte"]
      - name: source_station_id
        tests: [not_null]
      - name: station_code
        tests: [not_null]
      - name: measured_at_raw
        tests: [not_null]
      - name: measured_at_parsed
      - name: is_measured_at_valid
        tests: [not_null]
      - name: raw_payload
        tests: [not_null]

  - name: stg_respira_stations_cache
    description: "Persisted staging cache for Respira station metadata. Keeps the latest known latitude, longitude, name, and location type per locationId from the current-list Airbyte table."
    columns:
      - name: _airbyte_raw_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              values: ["respira_airbyte"]
      - name: source_station_id
        tests: [not_null, unique]
      - name: station_code
        tests: [not_null]
      - name: raw_payload
        tests: [not_null]

  - name: stg_meteostat_weather
    description: "Staging view for Meteostat Airbyte tables for airport weather stations."
    columns:
      - name: _airbyte_raw_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              values: ["meteostat_airbyte"]
      - name: station_code
        tests:
          - not_null
          - accepted_values:
              values: ["asu_airport", "cde_airport", "posadas_airport"]
      - name: measured_at_raw
      - name: measured_at_parsed
      - name: is_measured_at_valid
        tests: [not_null]
      - name: raw_payload
        tests: [not_null]

  - name: stg_respira_measurements
    description: "Staging view for Respira Airbyte history. Uses timestamp as the measurement time, locationId as the source station id, and prefers corrected sensor values when present."
    columns:
      - name: _airbyte_raw_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - accepted_values:
              values: ["respira_airbyte"]
      - name: source_station_id
        tests: [not_null]
      - name: station_code
        tests: [not_null]
      - name: measured_at_raw
      - name: measured_at_parsed
      - name: is_measured_at_valid
        tests: [not_null]
      - name: raw_payload
        tests: [not_null]
