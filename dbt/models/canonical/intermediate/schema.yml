version: 2

models:
  - name: int_measurement_timestamps_silver
    description: >
      Recent row-grain processing queue for canonical timestamps. It supplies per-source incremental
      checkpoints, measured-time process bounds, and resumable backfill input; it is not a historical
      analytical contract. Prepared sources provide their canonical time fields and simple sources use
      parsed-time pass-through before the wide-to-long explosion. Rows may be removed only after their
      process scope has published successfully, stream state has refreshed, and smoke tests have passed.
      Backfill continuation with run_ingest=False is supported only while all required source rows remain
      in this queue.
    config:
      meta:
        operational_role: processing_queue
        grain: data_source_name, source_row_id
        historical_contract: false
    columns:
      - name: source_row_id
        description: "Source-local row identity; unique together with data_source_name and stable across retries."
        tests: [not_null]
      - name: extracted_at
        description: "Source extraction timestamp used as the per-source incremental ingest checkpoint."
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data_sources')
                field: name
      - name: station_code
        tests: [not_null]
      - name: cursor_id
        description: "Continuity cursor for sources that have it (FIUNA)."
      - name: measured_at_parsed
        description: "Raw parsed timestamp (UTC) from source."
      - name: is_measured_at_valid
      - name: measured_at_silver
        description: "Final canonical timestamp after time cleaning and the basis for half-open process windows. May be null when no valid timestamp exists and no imputation is possible."
      - name: is_time_imputed
        tests: [not_null]
        description: "True when measured_at_silver was imputed from prior valid continuity."
      - name: time_impute_method
        description: "Method used to repair time or the reason it could not be repaired."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["data_source_name", "source_row_id"]
      - dbt_utils.expression_is_true:
          expression: "coalesce((not is_measured_at_valid) or measured_at_silver is not null, true)"

  - name: int_measurement_payloads
    description: >
      One-row-per-source-record payload store for audit/debug.
      Keeps raw JSON exactly once per ingested source row.
    columns:
      - name: source_row_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data_sources')
                field: name
      - name: raw_payload
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["data_source_name", "source_row_id"]

  - name: int_measurements_long
    description: >
      Canonical long-form measurements union across sources defined in vars.measurements_sources.
      Selects eligible source rows from int_measurement_timestamps_silver first, then explodes each row by configured variable.
    columns:
      - name: station_code
        tests: [not_null]
      - name: data_source_name
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data_sources')
                field: name
      - name: measured_at_parsed
        description: "Raw parsed timestamp (UTC) from source."
      - name: cursor_id
        description: "Continuity cursor. Present for FIUNA; null for AireLibre, MADES Open, and Meteostat."
      - name: is_measured_at_valid
      - name: measured_at_silver
        description: "Final canonical timestamp after row-grain time cleaning."
      - name: is_time_imputed
        description: "True when measured_at_silver was imputed upstream from row-grain continuity."
      - name: time_impute_method
        description: "Method used to repair time or the reason it could not be repaired."
      - name: variable_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_variables')
                field: code
      - name: source_row_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: value_raw
        tests: [not_null]
      - name: value_parsed

    tests:
      - dbt_utils.expression_is_true:
          expression: "variable_code in (select code from {{ ref('variables') }})"

  - name: int_measurements_time_silver
    description: >
      Compatibility view that preserves the historical long-grain time-silver interface while delegating
      canonical time computation to int_measurement_timestamps_silver upstream of int_measurements_long.
    columns:
      - name: data_source_name
        tests: [not_null]
      - name: station_code
        tests: [not_null]
      - name: cursor_id
        description: "Continuity cursor for sources that have it (FIUNA)."
      - name: measured_at_parsed
      - name: is_measured_at_valid
      - name: measured_at_silver
        description: "Final canonical timestamp after time cleaning. May be null when no valid timestamp exists and no imputation is possible."
      - name: is_time_imputed
        tests: [not_null]
      - name: time_impute_method
        description: "Method identifier for time imputation."
      - name: value_raw
        tests: [not_null]

  - name: int_measurements_values_silver
    description: >
      Silver value validation/cleaning output. Applies variable-specific validation and
      forward-fills missing values from the last valid observation in the same source/station/variable stream to produce value_silver.
      Materialized incrementally with per-stream anchor rows so downstream silver facts do not need to recompute the full value window on every run.
      The fact model should only consume rows where measured_at_silver is not null and value_silver is not null.
    columns:
      - name: source_row_id
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: data_source_name
        tests: [not_null]
      - name: station_code
        tests: [not_null]
      - name: variable_code
        tests: [not_null]
      - name: cursor_id
      - name: measured_at_silver
        tests: [not_null]
      - name: value_raw
        tests: [not_null]
      - name: value_parsed
      - name: is_value_imputed
        description: "True when value_silver was forward-filled from the last valid observation."
      - name: value_impute_method
        description: "Method used to repair missing values or the reason a value could not be repaired."
      - name: value_silver
        description: "Validated/cleaned final numeric value. Null when invalid."

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["source_row_id", "variable_code"]
      - dbt_utils.expression_is_true:
          expression: "variable_code in (select code from {{ ref('variables') }})"

  - name: int_stations_candidates
    description: "Union of stations from static seed plus dynamically discovered AireLibre and MADES Open stations."
    columns:
      - name: code
        tests: [not_null]
      - name: name
        tests: [not_null]
      - name: latitude
      - name: longitude
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["active", "inactive"]
      - name: properties
        tests: [not_null]

  - name: int_streams_candidates
    description: "Distinct station_code x variable_code x data_source_name combinations derived from int_measurement_timestamps_silver plus the source registry."
    columns:
      - name: station_code
        tests: [not_null]
      - name: variable_code
        tests: [not_null]
      - name: data_source_name
        tests: [not_null]
      - name: code
        tests: [not_null]
      - name: name
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["code"]
