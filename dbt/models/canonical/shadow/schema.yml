version: 2

models:
  - name: fct_measurements_silver_shadow
    description: "Validation-only silver fact isolated by its _shadow relation name in the silver schema."
    columns:
      - name: source_row_id
        tests: [not_null]
      - name: stream_id
        tests: [not_null]
      - name: timestamp
        tests: [not_null]
      - name: value_parsed
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [stream_id, timestamp]

  - name: measurement_stream_state_shadow
    description: "Isolated carry-forward state advanced only by successfully published shadow rows."
    columns:
      - name: data_source_name
        tests: [not_null]
      - name: station_code
        tests: [not_null]
      - name: variable_code
        tests: [not_null]
      - name: last_measured_at_silver
        tests: [not_null]
      - name: last_extracted_at
        tests: [not_null]
      - name: last_source_row_id
        tests: [not_null]
      - name: last_value_silver
        tests: [not_null]
      - name: updated_at
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [data_source_name, station_code, variable_code]
