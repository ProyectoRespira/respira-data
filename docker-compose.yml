services:

  prefect_server:
    image: prefecthq/prefect:3.6.20-python3.12
    container_name: prefect_server
    env_file:
      - .env
    environment:
      PREFECT_UI_URL: ${PREFECT_UI_URL:-http://localhost:4200}
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
      PREFECT_UI_SERVE_BASE: ${PREFECT_UI_SERVE_BASE:-/}
      PREFECT_SERVER_API_HOST: ${PREFECT_SERVER_API_HOST:-0.0.0.0}
      PREFECT_SERVER_API_PORT: ${PREFECT_SERVER_API_PORT:-4200}
    command: ["prefect", "server", "start", "--host", "${PREFECT_SERVER_API_HOST:-0.0.0.0}", "--port", "${PREFECT_SERVER_API_PORT:-4200}"]
    ports:
      - "${PREFECT_SERVER_API_PORT:-4200}:${PREFECT_SERVER_API_PORT:-4200}"
    # Health check using Python (works in Prefect image without curl)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; port=os.getenv('PREFECT_SERVER_API_PORT','4200'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      - DBT_PROJECT_DIR=${DBT_PROJECT_DIR:-/app/dbt}
      - DBT_PROFILES_DIR=${DBT_PROFILES_DIR:-/app/dbt}
      - PREFECT_API_URL=${PREFECT_API_URL:-http://prefect_server:${PREFECT_SERVER_API_PORT:-4200}/api}
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      prefect_server:
        condition: service_healthy
    command: ["bash", "-lc", "sleep infinity"]

  prefect_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    working_dir: /app
    environment:
      - DBT_PROJECT_DIR=${DBT_PROJECT_DIR:-/app/dbt}
      - DBT_PROFILES_DIR=${DBT_PROFILES_DIR:-/app/dbt}
      - PREFECT_API_URL=${PREFECT_API_URL:-http://prefect_server:${PREFECT_SERVER_API_PORT:-4200}/api}
      - PREFECT_WORKER_TYPE=${PREFECT_WORKER_TYPE:-process}
      - PREFECT_CANONICAL_WORK_POOL=${PREFECT_CANONICAL_WORK_POOL:-canonical}
      - PREFECT_PROJECT_RESPIRA_GOLD_WORK_POOL=${PREFECT_PROJECT_RESPIRA_GOLD_WORK_POOL:-respira_gold}
      - PREFECT_SCHEDULE_TIMEZONE=${PREFECT_SCHEDULE_TIMEZONE:-UTC}
    env_file:
      - .env
    # Health check to verify Prefect worker is operational
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'prefect worker start' > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      prefect_server:
        condition: service_healthy
    command: ["bash", "/usr/local/bin/prefect_worker_start.sh"]
    restart: unless-stopped
